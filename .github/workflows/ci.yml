name: Foundation checks
on:
  push:
    branches: [main]
    paths: ['src/**', 'tests/**', 'profiles/**', 'schemas/**', 'registry/**', 'scripts/**', 'pyproject.toml', '.github/workflows/**']
  pull_request:
    paths: ['src/**', 'tests/**', 'profiles/**', 'schemas/**', 'registry/**', 'scripts/**', 'pyproject.toml', '.github/workflows/**']
permissions:
  contents: read
concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python3 -m pip install 'jsonschema==4.26.0' 'PyYAML==6.0.3'
      - run: PYTHONPATH=src python3 -m unittest discover -s tests -v
      - run: PYTHONPATH=src python3 -m gaia_security validate-configs
      - run: PYTHONPATH=src python3 -m gaia_security selftest
      - name: Verify installed CLI against explicit trusted governance
        run: |
          python3 -m pip install --no-deps .
          cd "$RUNNER_TEMP"
          GAIA_SECURITY_ROOT="$GITHUB_WORKSPACE" gaia-sec selftest
